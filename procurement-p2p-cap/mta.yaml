_schema-version: 3.3.0
ID: procurement-p2p-cap
version: 1.0.0
description: "Bloco G - Purchase-to-Pay: elegibilidade de fornecedor (PIR + QIR), pedido com aprovação por alçada e integração com o ERP (simulada)"
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: procurement-p2p-cap-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      memory: 512M
      disk-quota: 512M
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: procurement-p2p-cap-auth
      - name: procurement-p2p-cap-db
      - name: procurement-p2p-cap-destination

  - name: procurement-p2p-cap-db-deployer
    type: hdb
    path: gen/db
    parameters:
      memory: 256M
      disk-quota: 512M
      buildpack: nodejs_buildpack
    requires:
      - name: procurement-p2p-cap-db
  - name: procurement-p2p-cap
    type: approuter.nodejs
    path: .deploy/app-router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: procurement-p2p-cap-auth
      - name: procurement-p2p-cap-html5-runtime
      - name: procurement-p2p-cap-destination
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

  - name: procurement-p2p-cap-app-deployer
    type: com.sap.application.content
    path: gen
    build-parameters:
      build-result: app/
      requires:
        - name: procurementp2pcapmaterials
          artifacts:
            - materials.zip
          target-path: app/
    requires:
      - name: procurement-p2p-cap-auth
      - name: srv-api
      - name: procurement-p2p-cap-html5-repo-host
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    parameters:
      config:
        destinations:
          - Name: srv-api
            URL: ~{srv-api/srv-url}
            Authentication: NoAuthentication
            Type: HTTP
            ProxyType: Internet
            ForwardAuthToken: true
            DynamicDestination: true

  - name: procurementp2pcapmaterials
    type: html5
    path: app/materials
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm run build
      supported-platforms:
        []

  - name: procurement-p2p-cap-destinations
    type: com.sap.application.content
    requires:
      - name: procurement-p2p-cap-auth
        parameters:
          service-key:
            name: procurement-p2p-cap-auth-key
      - name: procurement-p2p-cap-html5-repo-host
        parameters:
          service-key:
            name: procurement-p2p-cap-html5-repo-host-key
      - name: srv-api
      - name: procurement-p2p-cap-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: procurement-p2p-cap-html5-repository
              ServiceInstanceName: procurement-p2p-cap-html5-repo-host
              ServiceKeyName: procurement-p2p-cap-html5-repo-host-key
              sap.cloud.service: procurementp2pcap.service
            - Name: procurement-p2p-cap-auth
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: procurement-p2p-cap-auth
              ServiceKeyName: procurement-p2p-cap-auth-key
              sap.cloud.service: procurementp2pcap.service

resources:
  - name: procurement-p2p-cap-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: procurement-p2p-cap-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
          redirect-uris:
            - https://*~{app-api/app-uri}/**
        role-collections:
          - name: 'Viewer (procurement-p2p-cap ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.Viewer'
          - name: 'Buyer (procurement-p2p-cap ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.Buyer'
          - name: 'Approver (procurement-p2p-cap ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.Approver'
          - name: 'ApproverSenior (procurement-p2p-cap ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.ApproverSenior'
    requires:
      - name: app-api
  - name: procurement-p2p-cap-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: procurement-p2p-cap-html5-repo-host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
  - name: procurement-p2p-cap-html5-runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime
  - name: procurement-p2p-cap-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
    requires:
      - name: srv-api
